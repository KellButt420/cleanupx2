name: Windows x64
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      RestoreLockedMode: 'true'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Install pinned Rust toolchain
        run: |
          $pin = [regex]::Match((Get-Content rust-toolchain.toml -Raw), 'channel\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $pin) { throw 'Missing Rust toolchain pin.' }
          rustup toolchain install $pin --profile minimal --component clippy,rustfmt --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
      - name: Rust safety tests and lint
        run: ./scripts/verify-core.ps1
      - name: Release tooling guards
        run: ./scripts/verify-release-tooling.ps1
      - name: Build development-signed MSIX
        run: ./scripts/package-dev.ps1
      - name: Checksums
        run: |
          $files = Get-ChildItem artifacts/packages -Recurse -Filter '*.msix' | Where-Object { $_.FullName -notmatch '\\Dependencies\\(arm64|arm|win32|x86)\\' }
          if (-not $files) { throw 'No package outputs.' }
          $lines = $files | ForEach-Object { '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), ([IO.Path]::GetRelativePath((Resolve-Path artifacts).Path, $_.FullName) -replace '\\','/') }
          $lines | Set-Content artifacts/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cleanup-x64-development
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/packages/Cleanup_*_x64_Test/Cleanup_*_x64.msix
            artifacts/packages/Cleanup_*_x64_Test/Dependencies/x64/*.msix
            artifacts/packaging/CleanupDev.cer
            artifacts/SHA256SUMS.txt
